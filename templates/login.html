<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANBOT — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050806;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#F3FFF1;background-image:radial-gradient(ellipse at 20% 50%,rgba(57,255,20,.08) 0,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(31,216,95,.07) 0,transparent 60%),linear-gradient(180deg,#040705 0%,#08110B 100%)}
.card{background:linear-gradient(180deg,#08110B,#050806);border:1px solid #1F3527;border-radius:24px;padding:44px 38px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.7), inset 0 0 0 1px rgba(57,255,20,.04)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:52px;font-weight:900;letter-spacing:-1px}
.logo h1 span.dan{color:#39FF14;text-shadow:0 0 30px rgba(57,255,20,.45)}
.logo h1 span.bot{color:#D9FFD8;text-shadow:0 0 28px rgba(57,255,20,.18)}
.logo p{color:#7FA688;font-size:14px;margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.broker-select{margin-bottom:20px}
.broker-select label{display:block;color:#8FB996;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.broker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.broker-btn{background:#08110B;border:2px solid #1F3527;border-radius:10px;padding:10px 6px;color:#9FB7A2;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.broker-btn:hover,.broker-btn.active{border-color:#39FF14;color:#39FF14;background:rgba(57,255,20,.08)}
.field{margin-bottom:16px}
.field label{display:block;color:#8FB996;font-size:12px;margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.field input{width:100%;background:#08110B;border:1px solid #1F3527;border-radius:10px;padding:13px 16px;color:#F9FAFB;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#39FF14;box-shadow:0 0 0 3px rgba(57,255,20,.08)}
.field input::placeholder{color:#6B7280}
.license-field{display:none}
.btn-login{width:100%;background:linear-gradient(135deg,#39FF14,#1FD85F);border:none;border-radius:12px;padding:15px;color:#041006;font-size:16px;font-weight:900;cursor:pointer;margin-top:8px;letter-spacing:1px;transition:all .2s;text-transform:uppercase}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(57,255,20,.3)}
.btn-login:active{transform:translateY(0)}
.btn-master{width:100%;background:linear-gradient(135deg,#1FD85F,#15913F);border:none;border-radius:12px;padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;letter-spacing:1px;transition:all .2s;text-transform:uppercase}
.btn-master:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(57,255,20,.22)}
.msg{text-align:center;padding:10px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
.msg.error{background:rgba(239,68,68,.12);color:#EF4444;border:1px solid rgba(239,68,68,.2);display:block}
.msg.warn{background:rgba(245,158,11,.12);color:#F59E0B;border:1px solid rgba(245,158,11,.2);display:block}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.divider span{color:#4B5563;font-size:12px;white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1F3527}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:10px;background:#08110B;border:2px solid transparent;border-radius:10px;color:#9FB7A2;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.tab.active{border-color:#39FF14;color:#39FF14;background:rgba(57,255,20,.08)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1><span class="dan">DAN</span><span class="bot">BOT</span></h1>
    <p>Trading Bot OTC</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setTab('user')">👤 Usuário</div>
    <div class="tab" onclick="setTab('master')">👑 Master</div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- Usuário: usuário + senha -->
  <div id="tab-user">
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="inp-user" placeholder="seu usuario" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="inp-pass" placeholder="sua senha" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin('user')">Entrar</button>
  </div>

  <!-- Master: usuário + senha (a senha do Master é definida no PRIMEIRO acesso) -->
  <div id="tab-master" style="display:none">
    <div class="field">
      <label>Usuário Master</label>
      <input type="text" id="inp-user-m" placeholder="usuario master" autocomplete="username">
    </div>
    <div class="field">
      <label id="pass-label-m">Senha</label>
      <input type="password" id="inp-pass-m" placeholder="defina a senha no primeiro acesso" autocomplete="current-password">
    </div>
    <button class="btn-master" onclick="doLogin('master')">👑 Entrar como Master</button>
    <div style="color:#6B7280;font-size:11px;margin-top:12px;text-align:center">No primeiro acesso a senha digitada fica registrada. Guarde bem.</div>
  </div>
</div>

<script>
function setTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(t==='user'?'tab-user':'tab-master').style.display = t==='user'?'block':'none';
  document.getElementById(t==='user'?'tab-master':'tab-user').style.display = t==='user'?'none':'block';
  event.target.classList.add('active');
}
function showMsg(t, kind){
  const m=document.getElementById('msg');
  m.textContent=t; m.className='msg '+(kind||'error');
}
function doLogin(kind){
  const isM = kind==='master';
  const user = document.getElementById(isM?'inp-user-m':'inp-user').value.trim();
  const pass = document.getElementById(isM?'inp-pass-m':'inp-pass').value;
  if(!user||!pass){showMsg('Preencha usuário e senha');return;}
  showMsg('Verificando...','warn');
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:user,password:pass})})
  .then(r=>r.json().catch(()=>({error:'Erro no servidor'})))
  .then(j=>{
    if(j.ok){
      localStorage.setItem('danbot_token',j.token);
      localStorage.setItem('danbot_role',j.role||'user');
      location.href = (j.role==='admin')?'/master':'/dashboard';
    } else showMsg(j.error||'Login falhou');
  })
  .catch(()=>showMsg('Erro de conexao com o servidor'));
}
</script>
</body>
</html>
