<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DANBOT — Painel Master</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050806;font-family:'Segoe UI',sans-serif;color:#F9FAFB;min-height:100vh;background-image:radial-gradient(ellipse at top,rgba(57,255,20,.05),transparent 55%),linear-gradient(180deg,#040705 0%,#08110B 100%)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1F3527;border-radius:2px}
.topbar{background:#08110B;border-bottom:1px solid #1F3527;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:24px;font-weight:900}.logo .dan{color:#39FF14}.logo .bot{color:#D9FFD8}
.master-badge{background:rgba(57,255,20,.12);border:1px solid rgba(57,255,20,.28);border-radius:20px;padding:5px 16px;font-size:12px;color:#B9FFB0;font-weight:700}
.btn-sm{background:#08110B;border:1px solid #1F3527;border-radius:8px;padding:7px 14px;color:#9FB7A2;font-size:12px;cursor:pointer;transition:all .2s;font-weight:700}
.btn-sm:hover{border-color:#39FF14;color:#39FF14}
.main{padding:20px;max-width:1100px;margin:0 auto}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:#08110B;border:1px solid #1F3527;border-radius:14px;padding:16px}
.stat-card .lbl{font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-card .val{font-size:28px;font-weight:800}
.c-green{color:#39FF14}
.card{background:#08110B;border:1px solid #1F3527;border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;color:#8FB996;text-transform:uppercase;letter-spacing:1px;margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.field label{display:block;font-size:11px;color:#8FB996;margin-bottom:6px;text-transform:uppercase}
.field input{width:100%;background:#050806;border:1px solid #1F3527;border-radius:8px;padding:10px 14px;color:#F9FAFB;font-size:13px;outline:none}
.field input:focus{border-color:#39FF14}
.btn-create{background:linear-gradient(135deg,#39FF14,#1FD85F);border:none;border-radius:8px;padding:10px 20px;color:#041006;font-size:13px;font-weight:900;cursor:pointer;height:42px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#7FA688;font-weight:700;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid #1F3527;text-align:left;font-size:11px}
td{padding:10px 12px;border-bottom:1px solid #101A12}
.btn-del{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#EF4444;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700}
.btn-tgl{background:#08110B;border:1px solid #1F3527;color:#9FB7A2;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700;margin-right:6px}
.key-pill{background:rgba(57,255,20,.08);color:#39FF14;border:1px solid rgba(57,255,20,.25);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.ok{background:rgba(57,255,20,.1);color:#39FF14;border:1px solid rgba(57,255,20,.25);display:block}
.msg.err{background:rgba(239,68,68,.12);color:#EF4444;border:1px solid rgba(239,68,68,.2);display:block}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="dan">DAN</span><span class="bot">BOT</span></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="master-badge">👑 MASTER</span>
    <button class="btn-sm" onclick="logout()">Sair</button>
  </div>
</div>
<div class="main">
  <div class="stats-row">
    <div class="stat-card"><div class="lbl">Usuarios</div><div class="val c-green" id="stTotal">-</div></div>
    <div class="stat-card"><div class="lbl">Ativos</div><div class="val c-green" id="stActive">-</div></div>
    <div class="stat-card"><div class="lbl">Masters</div><div class="val c-green" id="stMasters">-</div></div>
  </div>

  <div class="card">
    <div class="card-title">Criar usuario (gera chave aleatoria de acesso)</div>
    <div class="form-row">
      <div class="field"><label>Nome do usuario</label><input id="nuName" placeholder="ex: cliente01"></div>
      <button class="btn-create" onclick="createUser()">Criar + chave</button>
    </div>
    <div class="msg" id="msgNew"></div>
  </div>

  <div class="card">
    <div class="card-title">Usuarios</div>
    <table>
      <thead><tr><th>Usuario</th><th>Papel</th><th>Status</th><th>Criado</th><th>Acoes</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">carregando...</td></tr></tbody>
    </table>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
function headers(){const t=localStorage.getItem('danbot_token');return t?{'Content-Type':'application/json','Authorization':'Bearer '+t}:{'Content-Type':'application/json'};}
function show(id,txt,cls){const m=document.getElementById(id);m.textContent=txt;m.className='msg '+cls;}
async function loadAll(){
  try{
    const r=await fetch('/api/master/stats',{headers:headers()});
    if(r.status===403){location.href='/';return;}
    const s=await r.json();
    if(s.ok){document.getElementById('stTotal').textContent=s.total;document.getElementById('stActive').textContent=s.active;document.getElementById('stMasters').textContent=s.masters;}
    const r2=await fetch('/api/master/users',{headers:headers()});
    const j2=await r2.json();
    if(j2.ok){
      document.getElementById('rows').innerHTML = j2.rows.map(x=>
        `<tr><td>${x.username}${x.username===j2.me?' <span class="key-pill">voce</span>':''}</td><td>${x.role==='admin'?'👑 master':'👤 user'}</td><td>${x.active?'✅ ativo':'⛔ inativo'}</td><td>${x.created||'-'}</td><td>${x.username!==j2.me?`<button class="btn-tgl" onclick="toggleUser('${x.username}')">${x.active?'Desativar':'Ativar'}</button><button class="btn-del" onclick="delUser('${x.username}')">Excluir</button>`:'-'}</td></tr>`).join('') || '<tr><td colspan="5">nenhum usuario</td></tr>';
    }
  }catch(e){show('msg','Erro: '+e,'err');}
}
async function createUser(){
  const nu=document.getElementById('nuName').value.trim();
  if(!nu){show('msgNew','Informe o nome','err');return;}
  const r=await fetch('/api/master/users',{method:'POST',headers:headers(),body:JSON.stringify({username:nu})});
  const j=await r.json();
  if(j.ok){
    show('msgNew',`Usuario ${j.username} criado! Chave de acesso: ${j.access_key}  (passe essa chave ao usuario - ele usa no lugar da senha no primeiro login)`,'ok');
    document.getElementById('nuName').value='';
    loadAll();
  } else show('msgNew',j.error||'Falhou','err');
}
async function toggleUser(u){
  await fetch(`/api/master/users/${u}/toggle`,{method:'POST',headers:headers()});
  loadAll();
}
async function delUser(u){
  if(!confirm(`Excluir ${u}? A area dele (estado do bot, conexao) sera apagada.`))return;
  const r=await fetch(`/api/master/users/${u}/delete`,{method:'POST',headers:headers()});
  const j=await r.json();
  if(j.ok){show('msg',`${u} excluido - area apagada`,'ok');loadAll();}
  else show('msg',j.error||'Falhou','err');
}
async function logout(){await fetch('/api/logout',{method:'POST'});localStorage.removeItem('danbot_token');localStorage.removeItem('danbot_role');location.href='/';}
loadAll();
</script>
</body>
</html>
